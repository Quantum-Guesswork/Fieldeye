[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stitchlive"
version = "0.1.0"
description = "Skladanie zdjec z drona w czasie rzeczywistym na bazie OpenCV"
requires-python = ">=3.9"
dependencies = ["opencv-contrib-python>=4.8,<5.0", "numpy>=1.24,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
stitchlive = "stitchlive.cli:main"

[tool.setuptools.packages.find]
include = ["stitchlive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
